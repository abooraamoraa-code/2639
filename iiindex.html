<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Master: محاكي النقر الخارق</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --panel-bg: #161b28;
            --accent-color: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.4);
            --secondary-color: #7000ff;
            --gold-color: #ffd700;
            --danger-color: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* الهيدر العلوي */
        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid rgba(0, 242, 255, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .game-title h1 { font-size: 1.5rem; color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); }
        .game-title p { font-size: 0.8rem; color: var(--text-muted); }

        .stats-bar {
            display: flex;
            gap: 30px;
        }
        .stat-box {
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .stat-box .val { font-size: 1.2rem; font-weight: bold; color: var(--gold-color); }
        .stat-box .lbl { font-size: 0.75rem; color: var(--text-muted); }

        /* تخطيط اللعبة الرئيسي */
        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            flex: 1;
            overflow: hidden;
        }

        /* لوحة الترقيات الجانبية */
        .sidebar {
            background-color: var(--panel-bg);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 15px;
        }
        .sidebar h2 { font-size: 1.1rem; color: var(--accent-color); margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }

        .upgrade-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .upgrade-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .upgrade-info { display: flex; justify-content: space-between; align-items: center; }
        .upgrade-name { font-weight: bold; font-size: 0.95rem; }
        .upgrade-level { background: var(--secondary-color); padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; }
        .upgrade-desc { font-size: 0.8rem; color: var(--text-muted); }
        
        button.buy-btn {
            background: linear-gradient(135deg, var(--accent-color), #0088ff);
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.2s;
        }
        button.buy-btn:hover { filter: brightness(1.2); }
        button.buy-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* منطقة التفاعل الوسطى (منطقة النقر) */
        .clicker-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #151929 0%, #0d0f18 100%);
        }

        #clicker-target {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f2ff 0%, #7000ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 50px var(--accent-glow);
            transition: transform 0.05s ease, box-shadow 0.2s ease;
            position: relative;
        }
        #clicker-target:active { transform: scale(0.92); box-shadow: 0 0 20px var(--accent-color); }
        #clicker-target span { font-size: 1.5rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* الأزرار الطافية والأحداث العشوائية */
        #golden-cookie {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fff700, #ff8800);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 25px var(--gold-color);
            animation: bounce 1s infinite alternate;
            z-index: 100;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }

        /* تأثيرات الأرقام المتطايرة عند النقر */
        .floating-text {
            position: absolute;
            font-weight: bold;
            color: var(--accent-color);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-size: 1.2rem;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }

        /* شريط إعادة الولادة (Prestige) */
        .prestige-panel {
            background: rgba(112, 0, 255, 0.1);
            border: 1px solid var(--secondary-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: auto;
        }
        .prestige-btn {
            background: linear-gradient(135deg, #7000ff, #ff0055);
            color: #fff;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="game-title">
            <h1>Clicker Master</h1>
            <p>مُحاكي النقر الخارق - الإصدار الخام الاحترافي</p>
        </div>
        <div class="stats-bar">
            <div class="stat-box">
                <div class="val" id="score-display">0</div>
                <div class="lbl">النقاط (القمم)</div>
            </div>
            <div class="stat-box">
                <div class="val" id="cps-display">0</div>
                <div class="lbl">في الثانية (CPS)</div>
            </div>
            <div class="stat-box">
                <div class="val" id="crystals-display">0</div>
                <div class="lbl">بلورات التطور 💎</div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- لوحة ترقيات النقرات والسرعة -->
        <div class="sidebar">
            <h2>⚡ ترقيات القوة والسرعة</h2>
            <div id="click-upgrades-container"></div>
        </div>

        <!-- مركز التفاعل والنقر -->
        <div class="clicker-section">
            <div id="golden-cookie" title="انقرني للثروة الفورية!">🎁</div>
            <div id="clicker-target">
                <span>انقر هنا!</span>
            </div>
        </div>

        <!-- لوحة المساعدين الآليين والبريستيج -->
        <div class="sidebar">
            <h2>🤖 المساعدون الآليون</h2>
            <div id="auto-upgrades-container"></div>

            <div class="prestige-panel">
                <h3>إعادة الولادة الكونية</h3>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin: 5px 0;">أعد تعيين النقاط مقابل مضاعفات دائمة للإنتاج.</p>
                <button class="prestige-btn" onclick="triggerPrestige()">بدء التطور الكوني</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * محرك لعبة Clicker Master - هندسة البيانات المتقدمة
         */
        const game = {
            score: 0,
            totalClicks: 0,
            cps: 0,
            clickPower: 1,
            criticalChance: 0.05, // 5% فرصة ضربة حرجة
            criticalMultiplier: 5,
            crystals: 0,
            prestigeMultiplier: 1,
            
            // تعريف الترقيات اليدوية
            clickUpgrades: [
                { id: 'c1', name: 'قوة الإصبع', desc: 'تزيد قوة النقر اليدوي بـ +1', cost: 15, powerAdd: 1, level: 0, costMult: 1.5 },
                { id: 'c2', name: 'النقرة الماسية', desc: 'تزيد قوة النقر اليدوي بـ +10', cost: 150, powerAdd: 10, level: 0, costMult: 1.6 },
                { id: 'c3', name: 'قبضة البرق', desc: 'تزيد قوة النقر اليدوي بـ +100', cost: 1200, powerAdd: 100, level: 0, costMult: 1.7 }
            ],

            // تعريف المساعدين الآليين (Idle Clickers)
            autoUpgrades: [
                { id: 'a1', name: 'الماوس الآلي', desc: 'ينتج نقطة واحدة كل ثانية (+1 CPS)', cost: 50, cpsAdd: 1, level: 0, costMult: 1.4 },
                { id: 'a2', name: 'المصفوفة الرقمية', desc: 'حاسوب يولد 10 نقاط في الثانية (+10 CPS)', cost: 600, cpsAdd: 10, level: 0, costMult: 1.5 },
                { id: 'a3', name: 'الذكاء الاصطناعي الخارق', desc: 'نظام متطور يولد 75 نقطة في الثانية (+75 CPS)', cost: 4500, cpsAdd: 75, level: 0, costMult: 1.55 }
            ]
        };

        // عناصر الواجهة
        const scoreEl = document.getElementById('score-display');
        const cpsEl = document.getElementById('cps-display');
        const crystalsEl = document.getElementById('crystals-display');
        const clickerTarget = document.getElementById('clicker-target');
        const clickUpgradesContainer = document.getElementById('click-upgrades-container');
        const autoUpgradesContainer = document.getElementById('auto-upgrades-container');
        const goldenCookie = document.getElementById('golden-cookie');

        // تحديث عرض البيانات على الشاشة
        function updateUI() {
            scoreEl.innerText = formatNumber(Math.floor(game.score));
            cpsEl.innerText = formatNumber(game.cps.toFixed(1));
            crystalsEl.innerText = formatNumber(game.crystals);

            // تحديث أزرار الترقيات اليدوية
            game.clickUpgrades.forEach(up => {
                const btn = document.getElementById(`btn-${up.id}`);
                const lvl = document.getElementById(`lvl-${up.id}`);
                const cost = document.getElementById(`cost-${up.id}`);
                if(btn) {
                    lvl.innerText = up.level;
                    cost.innerText = formatNumber(Math.floor(up.cost));
                    btn.disabled = game.score < up.cost;
                }
            });

            // تحديث أزرار الآليين
            game.autoUpgrades.forEach(up => {
                const btn = document.getElementById(`btn-${up.id}`);
                const lvl = document.getElementById(`lvl-${up.id}`);
                const cost = document.getElementById(`cost-${up.id}`);
                if(btn) {
                    lvl.innerText = up.level;
                    cost.innerText = formatNumber(Math.floor(up.cost));
                    btn.disabled = game.score < up.cost;
                }
            });
        }

        // تنسيق الأرقام الكبيرة بشكل جمالي
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return num.toString();
        }

        // بناء الواجهات للترقيات ديناميكياً
        function initShop() {
            clickUpgradesContainer.innerHTML = '';
            game.clickUpgrades.forEach(up => {
                clickUpgradesContainer.innerHTML += `
                    <div class="upgrade-card">
                        <div class="upgrade-info">
                            <span class="upgrade-name">${up.name}</span>
                            <span class="upgrade-level" id="lvl-${up.id}">0</span>
                        </div>
                        <div class="upgrade-desc">${up.desc}</div>
                        <button class="buy-btn" id="btn-${up.id}" onclick="buyClickUpgrade('${up.id}')">شراء بقيمة <span id="cost-${up.id}">${up.cost}</span></button>
                    </div>
                `;
            });

            autoUpgradesContainer.innerHTML = '';
            game.autoUpgrades.forEach(up => {
                autoUpgradesContainer.innerHTML += `
                    <div class="upgrade-card">
                        <div class="upgrade-info">
                            <span class="upgrade-name">${up.name}</span>
                            <span class="upgrade-level" id="lvl-${up.id}">0</span>
                        </div>
                        <div class="upgrade-desc">${up.desc}</div>
                        <button class="buy-btn" id="btn-${up.id}" onclick="buyAutoUpgrade('${up.id}')">شراء بقيمة <span id="cost-${up.id}">${up.cost}</span></button>
                    </div>
                `;
            });
        }

        // حدث النقر اليدوي الأساسي
        clickerTarget.addEventListener('click', (e) => {
            let addVal = game.clickPower * game.prestigeMultiplier;
            let isCrit = Math.random() < game.criticalChance;
            
            if (isCrit) {
                addVal *= game.criticalMultiplier;
                showFloatingText(e.clientX, e.clientY, `ضربة حرجة! +${formatNumber(addVal)}`, '#ff3366');
            } else {
                showFloatingText(e.clientX, e.clientY, `+${formatNumber(addVal)}`, '#00f2ff');
            }

            game.score += addVal;
            game.totalClicks++;
            updateUI();
        });

        // تأثير النصوص المتطايرة
        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            el.innerText = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // شراء ترقية يدوية
        function buyClickUpgrade(id) {
            const up = game.clickUpgrades.find(u => u.id === id);
            if (game.score >= up.cost) {
                game.score -= up.cost;
                up.level++;
                game.clickPower += up.powerAdd;
                up.cost *= up.costMult;
                updateUI();
            }
        }

        // شراء ترقية آلية
        function buyAutoUpgrade(id) {
            const up = game.autoUpgrades.find(u => u.id === id);
            if (game.score >= up.cost) {
                game.score -= up.cost;
                up.level++;
                game.cps += up.cpsAdd;
                up.cost *= up.costMult;
                updateUI();
            }
        }

        // حلقة الإنتاج التلقائي (Idle Loop - تنفذ كل ثانية)
        setInterval(() => {
            if (game.cps > 0) {
                game.score += (game.cps * game.prestigeMultiplier) / 10;
                updateUI();
            }
        }, 100);

        // نظام إعادة الولادة (Prestige)
        function triggerPrestige() {
            if (game.score < 10000) {
                alert('تحتاج إلى 10,000 نقطة على الأقل لبدء التطور الكوني!');
                return;
            }
            if (confirm('هل أنت متأكد؟ سيتم تصفير النقاط والترقيات مقابل الحصول على بلورات طاقة تضاعف قوتك للأبد!')) {
                const earnedCrystals = Math.floor(game.score / 5000);
                game.crystals += earnedCrystals;
                game.prestigeMultiplier += earnedCrystals * 0.5; // زيادة 50% لكل بلورة

                // تصفير التقدم في الجولة الحالية
                game.score = 0;
                game.cps = 0;
                game.clickPower = 1;
                game.clickUpgrades.forEach(u => { u.level = 0; u.cost = u.cost / Math.pow(u.costMult, u.level); });
                game.autoUpgrades.forEach(u => { u.level = 0; u.cpsAdd = u.cpsAdd; u.cost = u.cost / Math.pow(u.costMult, u.level); });
                
                initShop();
                updateUI();
                alert(`مبروك! لقد حصلت على ${earnedCrystals} بلورة طاقة جديدة.`);
            }
        }

        // نظام ظهور الحدث العشوائي (الماوس الذهبي الطائر)
        setInterval(() => {
            if (Math.random() > 0.6) {
                goldenCookie.style.display = 'flex';
                goldenCookie.style.left = Math.random() * (window.innerWidth - 100) + 'px';
                goldenCookie.style.top = Math.random() * (window.innerHeight - 100) + 'px';
                
                setTimeout(() => { goldenCookie.style.display = 'none'; }, 4000); // يختفي بعد 4 ثوانٍ
            }
        }, 15000);

        goldenCookie.addEventListener('click', () => {
            const reward = Math.max(500, game.cps * 50 + 200);
            game.score += reward;
            showFloatingText(window.innerWidth / 2, window.innerHeight / 2, `🎁 مكافأة ذهبية! +${formatNumber(reward)}`, '#ffd700');
            goldenCookie.style.display = 'none';
            updateUI();
        });

        // التشغيل الأولي
        initShop();
        updateUI();
    </script>
</body>
</html>
